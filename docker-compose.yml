version: "3.9"

services:
  redis:
    image: redis:7
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: decisionvault
      DB_USER: dvuser
      DB_PASSWORD: dvpass
      UV_LINK_MODE: copy

