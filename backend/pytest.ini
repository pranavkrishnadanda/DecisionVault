[pytest]
DJANGO_SETTINGS_MODULE = core.test_settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --tb=short
    --capture=no
    --verbose
    --reuse-db
env =
    D:DEBUG=True
    D:SECRET_KEY=test-secret-key-for-testing-only
    D:ALLOWED_HOSTS=localhost,127.0.0.1
    D:DB_HOST=localhost
    D:DB_NAME=decisionvault
    D:DB_USER=dvuser
    D:DB_PASSWORD=dvpass
    D:REDIS_HOST=localhost
    D:REDIS_PORT=6379
    D:RABBITMQ_HOST=localhost
    D:RABBITMQ_PORT=5672
    D:DECISIONVAULT_ENV=test
